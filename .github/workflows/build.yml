name: Build

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            windows-latest,
            macos-13,
            macos-latest,
          ]

    steps:
      - uses: actions/checkout@v4

      # Used to host cibuildwheel
      - uses: actions/setup-python@v5

      - name: Install gpgme and build tools (macOS)
        run: |
          which autoconf || brew install autoconf
          which automake || brew install automake
          which gpgme-config || brew install gpgme
          which pandoc || brew install pandoc
        if: runner.os == 'macOS'

      - name: Install MSYS2 and gpgme (Windows)
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gpgme
            mingw-w64-x86_64-toolchain
        if: runner.os == 'Windows'

      - name: Install Chocolatey (for Pandoc on Windows)
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          choco install pandoc -y
        if: runner.os == 'Windows'

      - name: Install gpgme and pandoc (Linux)
        run: sudo apt-get update && sudo apt-get install libgpgme11t64 libgpgme-dev pandoc
        if: runner.os == 'Linux'

      - name: Install swig and setuptools
        run: python -m pip install swig setuptools

      - name: Configure project
        run: ./autogen.sh && ./configure --enable-maintainer-mode && make

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.23.3

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        # to supply options, put them in 'env', like:
        # env:
        #   CIBW_SOME_OPTION: value
        #   ...

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
